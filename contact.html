<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Me - Ahmad Alkhdour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Ahmad Alkhdour</a>
      <nav class="menu">
        <a href="index.html">Home</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="page-title">
      <h1>Contact me</h1>
      <p>Send me a message using the form below.</p>
    </div>

    <section class="panel">
      <form id="contactForm" novalidate>
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName">

        <label for="email">Email address</label>
        <input type="email" id="email" name="email">

        <label for="country">Country</label>
        <input type="text" id="country" name="country">

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5"></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </div>

  <footer>
    &copy; 2026 Ahmad Alkhdour &middot; <a href="index.html">Back to Home</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
